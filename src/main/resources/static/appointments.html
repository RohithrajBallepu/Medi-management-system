<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Appointments | Hospital Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Appointments</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="patients.html">Patients</a>
        <a href="doctors.html">Doctors</a>
    </nav>

    <section>
        <h2>Add Appointment</h2>
        <form id="appointmentForm">
            <input type="text" id="patientId" placeholder="Patient ID" required>
            <input type="text" id="doctorId" placeholder="Doctor ID" required>
            <input type="datetime-local" id="appointmentDateTime" required>
            <button type="submit">Add</button>
        </form>
        <h2>Appointment List</h2>
        <table id="appointmentsTable">
            <tr>
                <th>ID</th>
                <th>Patient ID</th>
                <th>Doctor ID</th>
                <th>Date & Time</th>
            </tr>
            
        </table>
    </section>

    <script>
    const appointmentForm = document.getElementById('appointmentForm');

    appointmentForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const patientId = document.getElementById('patientId').value;
        const doctorId = document.getElementById('doctorId').value;
        const appointmentDateTime = document.getElementById('appointmentDateTime').value;

        fetch('/api/appointments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ patientId, doctorId, appointmentDateTime })
        })
        .then(response => response.json())
        .then(appointment => {
            alert('Appointment added successfully!');
            appointmentForm.reset();
            
        })
        .catch(error => alert('Error: ' + error));
    });

    function loadAppointments() {
        fetch('http://localhost:8080/api/appointments')
            .then(response => response.json())
            .then(appointments => {
                const table = document.getElementById('appointmentsTable');
                
                table.innerHTML = `
                    <tr>
                        <th>ID</th>
                        <th>Patient ID</th>
                        <th>Doctor ID</th>
                        <th>Date & Time</th>
                    </tr>
                `;
                appointments.forEach(appointment => {
                    const row = table.insertRow();
                    row.insertCell(0).textContent = appointment.id;
                    row.insertCell(1).textContent = appointment.patientId;
                    row.insertCell(2).textContent = appointment.doctorId;
                    row.insertCell(3).textContent = new Date(appointment.appointmentDateTime).toLocaleString();
                });
            })
            .catch(error => alert('Error loading appointments: ' + error));
    }

   
    window.onload = loadAppointments;

    </script>
</body>
</html>
