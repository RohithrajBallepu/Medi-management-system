<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patients | Hospital Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Patients</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="doctors.html">Doctors</a>
        <a href="appointments.html">Appointments</a>
    </nav>

    <section>
        <h2>Add Patient</h2>
        <form id="patientForm">
            <input type="text" id="patientName" placeholder="Name" required>
            <input type="number" id="patientAge" placeholder="Age" required>
            <input type="text" id="patientAddress" placeholder="Address" required>
            <button type="submit">Add</button>
        </form>
        <h2>Patient List</h2>
        <table id="patientsTable">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Address</th>
            </tr>
            <!-- Patient rows will go here -->
        </table>
    </section>

</body>
<script>
    const form = document.getElementById('patientForm');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('patientName').value;
        const age = document.getElementById('patientAge').value;
        const address = document.getElementById('patientAddress').value;

        fetch('http://localhost:8080/api/patients', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, age, address })
        })
        .then(response => response.json())
        .then(patient => {
            alert('Patient added successfully!');
            form.reset();
            // You can optionally add patient to table here
        })
        .catch(error => alert('Error: ' + error));
    });
</script>

</html>
