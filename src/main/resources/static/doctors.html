<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctors | Hospital Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Doctors</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="patients.html">Patients</a>
        <a href="appointments.html">Appointments</a>
    </nav>

    <section>
        <h2>Add Doctor</h2>
        <form id="doctorForm">
            <input type="text" id="doctorName" placeholder="Name" required>
            <input type="text" id="doctorSpecialization" placeholder="Specialization" required>
            <input type="text" id="doctorContact" placeholder="Contact" required>
            <button type="submit">Add</button>
        </form>
        <h2>Doctor List</h2>
        <table id="doctorsTable">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Specialization</th>
                <th>Contact</th>
            </tr>
           
        </table>
    </section>

<script>
const doctorForm = document.getElementById('doctorForm');

doctorForm.addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('doctorName').value;
    const specialization = document.getElementById('doctorSpecialization').value;
    const contact = document.getElementById('doctorContact').value;

    fetch('http://localhost:8080/api/doctors', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, specialization, contact })
    })
    .then(response => response.json())
    .then(doctor => {
        alert('Doctor added successfully!');
        doctorForm.reset();
        
    })
    .catch(error => alert('Error: ' + error));
});

function loadDoctors() {
    fetch('/api/doctors')
        .then(response => response.json())
        .then(doctors => {
            const table = document.getElementById('doctorsTable');
            // Clear existing rows except the header
            table.innerHTML = `
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Specialization</th>
                    <th>Contact</th>
                </tr>
            `;
            doctors.forEach(doctor => {
                const row = table.insertRow();
                row.insertCell(0).textContent = doctor.id;
                row.insertCell(1).textContent = doctor.name;
                row.insertCell(2).textContent = doctor.specialization;
                row.insertCell(3).textContent = doctor.contact;
            });
        })
        .catch(error => alert('Error loading doctors: ' + error));
}


window.onload = loadDoctors;


</script>


</body>
</html>
